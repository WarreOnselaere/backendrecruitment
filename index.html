body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13.5px}

main{padding:24px 32px}.top h2{font-size:20px;font-weight:600}
input,select,textarea{background:var(--inp);border-radius:9px}

*{scrollbar-color:var(--bd) transparent}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;vertical-align:middle}

.cbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:4px}

<body>
<aside><h1><span class="logo-sq">PD</span>Partner Directory</h1><input id="gSearch" placeholder="Search partners" autocomplete="off">
<button class="nav" data-v="partners">Partners</button>
<button class="nav" data-v="dashboard">Dashboard</button>
<button class="nav" data-v="pipeline">Pipeline</button>
<button class="nav" data-v="leads">Event leads</button>
<button class="nav" data-v="events">Events &amp; team</button><button class="nav" data-v="history">History</button><div style="margin-top:auto"><button class="nav" id="bell" style="margin-bottom:8px;width:100%">Notifications</button><div class="seg" id="themeTog"><button data-th="light">Light</button><button data-th="dark">Dark</button></div><div class="me"><span class="av" id="meAv">?</span><div style="flex:1;min-width:0"><label>You are</label><select id="meSel"></select></div></div><button class="nav" id="signOut" style="margin-top:6px;width:100%">Sign out</button></div></aside>
<main><div class="mnav"><button class="btn g" data-v="partners">Partners</button><button class="btn g" data-v="dashboard">Dashboard</button><button class="btn g" data-v="pipeline">Pipeline</button><button class="btn g" data-v="leads">Leads</button><button class="btn g" data-v="events">Events</button><button class="btn g" data-v="history">History</button></div><div id="app"></div></main>
<script>
const DEFAULTS=[["CD","Career Day",["Basic","Premium","Business"]],["IF","IF",["Basic","Premium"]],["CMG","CMG"],["MyBS","MyBS"],["HTBS","HTBS"],["FCF","FCF"],["SCD","SCD"],["UBG","UBG"],["CN","CN"],["MTCT","MTCT"],["PSN","PSN"]];
const S={partners:{},years:{},parts:{},view:"partners",Y:null,open:null,f:{q:"",resp:"",sector:"",ev:""},db:null,ready:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>new Intl.NumberFormat("en-BE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const COLS=["#3b6ef5","#e8794a","#8b7cf6","#2fa58f","#d9588c","#c9971a","#4a9fd8"];
const col=s=>COLS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLS.length];
const uid=()=>Math.random().toString(36).slice(2,10);
const years=()=>Object.keys(S.years).sort();
const ev=()=>S.years[S.Y]?.events||[];
const part=pid=>S.parts[pid+"_"+S.Y]||{pid,year:S.Y,notes:"",ev:{}};
const mtgInt=(pt,c)=>(pt.meetings||[]).some(m=>(m.interests||[]).includes(c));
const isInt=(pt,c)=>{const x=(pt.int||{})[c];if(x===null)return false;if(x)return true;return mtgInt(pt,c)};
const intDate=(pt,c)=>((pt.int||{})[c]||{}).date||'';
async function toggleInt(pid,code){const pt=JSON.parse(JSON.stringify(part(pid)));pt.int=pt.int||{};
 if(isInt(pt,code)){if(mtgInt(pt,code))pt.int[code]=null;else delete pt.int[code]}else pt.int[code]={date:today(),by:(S.me||'')};
 await save('parts',pid+'_'+S.Y,pt)}
async function joinEv(pid,code){const pt=JSON.parse(JSON.stringify(part(pid))),e=ev().find(x=>x.code===code);if(!e)return;
 pt.ev[code]={pkg:e.packages?.[0]?.name||'',disc:0,note:''};await save('parts',pid+'_'+S.Y,pt)}

const respOf=id=>part(id).resp??S.partners[id]?.responsible??'';
window.addEventListener('error',e=>toast('Error: '+e.message));
const LOG=[['email','Email sent','#5b9bd5'],['reminder','Reminder sent','#3b82c4'],['call','Called','#2f6fb0'],['meeting','Meeting planned','#d49a1f'],['met','Meeting held','#b8730f'],['noreact','No reaction','#8a8f98'],['confirmed','Confirmed','#1e9e5a'],['declined','Declined','#c0392b'],['note','Note','#6a7f80']];
const LOGT=Object.fromEntries(LOG.map(([k,l,c])=>[k,[l,c]]));
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>ymd(new Date());
const fmtD=d=>d?d.split('-').reverse().slice(0,2).join('/'):'';
const sortLog=id=>(part(id).log||[]).map((x,i)=>({...x,i})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.i-a.i);
const stepOf=id=>sortLog(id).find(x=>x.type!=='note');
const GAP={email:.6,reminder:.7,call:1,meeting:2,met:1,noreact:3};
const gapFor=t=>{const o=(S.years[S.Y]?.stepDays||{})[t];return o>0?o:Math.max(1,Math.round(fuDays()*(GAP[t]??1)))};
const touches=id=>{let n=0;for(const x of sortLog(id)){if(['meeting','met','confirmed','declined'].includes(x.type))break;if(['email','reminder','call'].includes(x.type))n++}return n};
const NXT=(id,type,pre)=>{const n=touches(id)+(pre&&['email','reminder','call'].includes(type)?1:0);
 if(type==='noreact')return['Last attempt or archive',gapFor('noreact')];
 if(['email','reminder','call'].includes(type)){if(n>=4)return['Close out: call once more or log No reaction',gapFor(type)];
  if(type==='email')return[n>=2?'Call them (switch channel)':'Send reminder',gapFor('email')];

 const dr=[];if(sel.includes('docs'))ids.forEach(id=>(S.partners[id].docs||[]).forEach(d=>dr.push({Company:S.partners[id].name,Type:d.type,File:d.name,Date:d.date,Link:d.url})));if(sel.includes('docs'))add('Documents',dr);
 const tr=[];if(sel.includes('tasks')){ids.forEach(id=>tasksOf(id).forEach(t=>tr.push({Type:'Company',For:S.partners[id].name,Task:t.title,Deadline:t.date||'','Assigned to':t.who||'',Done:t.done?'Yes':''})));E.forEach(e=>(e.tasks||[]).forEach(t=>tr.push({Type:'Event',For:e.code,Task:t.title,Deadline:t.date||'','Assigned to':t.who||'',Done:t.done?'Yes':''})));add('Tasks '+Y,tr.sort((a,b)=>(a.Deadline||'9').localeCompare(b.Deadline||'9')))}

(function(){

 document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.ddb');

  if(!items.length){if(cur&&cur.anchor===i)close();return}
  show(i,items,'',it=>{i.value=it.v;i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}))},null)};
 document.addEventListener('focusin',e=>{const i=e.target;if(i.tagName==='INPUT'&&i.dataset.list)sug(i)});
 document.addEventListener('input',e=>{const i=e.target;if(i.tagName==='INPUT'&&i.dataset.list)sug(i)});
 document.addEventListener('focusout',e=>{if(cur&&!cur.btn&&cur.anchor===e.target)close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur){e.stopImmediatePropagation();close()}},true);
 window.addEventListener('resize',close);document.addEventListener('scroll',e=>{if(cur&&e.target!==pop&&!pop.contains(e.target))close()},true);
 new MutationObserver(()=>{if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;enhance()})}).observe(document.body,{childList:true,subtree:true});
 enhance();
})();

/* ---- Vercel backend: sign-in, database and files live behind /api ---- */
const FB={};let started=false;
function showLogin(msg,ok){
 let el=$('#login');if(!el){el=document.createElement('div');el.id='login';el.className='ov';el.style.cssText='z-index:100;align-items:center;justify-content:center;background:var(--bg)';document.body.appendChild(el)}
 el.innerHTML=`<div class='dlg' style='width:min(380px,92vw)'><h2>Partner Directory</h2><p class='mut' style='margin:0 0 14px'>Sign in with your team account.</p><label>Email</label><input id='lgEmail' type='email' autocomplete='username'><label style='margin-top:10px'>Password</label><input id='lgPass' type='password' autocomplete='current-password'><div class='err' id='lgErr' style='${ok?'color:var(--ok)':''}'>${esc(msg||'')}</div><div class='acts' style='justify-content:space-between'><button class='btn g' id='lgReset'>Forgot password</button><button class='btn' id='lgGo'>Sign in</button></div></div>`;
 const go=()=>api('/auth',{method:'POST',body:{action:'login',email:$('#lgEmail').value.trim(),password:$('#lgPass').value}}).then(r=>boot(r.user)).catch(e=>{$('#lgErr').style.color='';$('#lgErr').textContent=e.message||'Sign-in failed.'});
 $('#lgGo').onclick=go;$('#lgPass').onkeydown=e=>{if(e.key==='Enter')go()};
 $('#lgReset').onclick=()=>{$('#lgErr').style.color='';$('#lgErr').textContent='Ask an admin to reset your password.'};
}
document.addEventListener('click',e=>{if(e.target.id==='signOut'&&!FB.demo)api('/auth',{method:'POST',body:{action:'logout'}}).finally(()=>location.reload())});

/* ---- Local demo mode (no Firebase needed): data lives in this browser only ---- */
function makeLocalDb(){
 const KEY='pd_local_db';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
 const subs=[],persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Browser storage is full')}diskSync()};
 const snap=(name,q)=>{let docs=Object.entries(data[name]||{}).map(([id,v])=>({id,data:()=>JSON.parse(JSON.stringify(v))}));
  if(q.ob)docs.sort((a,b)=>{const x=a.data()[q.ob[0]],y=b.data()[q.ob[0]];return(x>y?1:x<y?-1:0)*(q.ob[1]==='desc'?-1:1)});
  if(q.lim)docs=docs.slice(0,q.lim);return{docs}};
 const notify=name=>subs.filter(s=>s.name===name).forEach(s=>s.cb(snap(name,s.q)));
 const coll=name=>{const q={},o={orderBy:(f,d)=>{q.ob=[f,d||'asc'];return o},limit:n=>{q.lim=n;return o},
  onSnapshot:cb=>{const s={name,cb,q};subs.push(s);setTimeout(()=>cb(snap(name,q)),0);return()=>subs.splice(subs.indexOf(s),1)},
  doc:id=>({set:async v=>{(data[name]=data[name]||{})[id]=JSON.parse(JSON.stringify(v));persist();setTimeout(()=>notify(name),0)},delete:async()=>{if(data[name])delete data[name][id];persist();setTimeout(()=>notify(name),0)}})};return o};
 return{collection:coll,settings(){}}}
let _ds;
function diskSync(now){if(!window.pdDisk)return Promise.resolve();clearTimeout(_ds);
 const run=()=>{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k==='pd_local_db'||k==='pd_me'||k.startsWith('pd_file_'))o[k]=localStorage.getItem(k)}return pdDisk.save(o).catch(e=>toast('Could not save to disk: '+((e&&e.message)||e)))};
 if(now)return run();_ds=setTimeout(run,400);return Promise.resolve()}
async function startDemo(){
 if(window.pdDisk){try{const disk=await pdDisk.load();if(disk&&disk.pd_local_db){Object.keys(disk).forEach(k=>localStorage.setItem(k,disk[k]))}else{await diskSync(true)}}catch(e){toast('Could not read the data file')}}
 FB.demo=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}FB.db=makeLocalDb();
 FB.assets={upload:async f=>{if(f.size>1.2*1024*1024)throw new Error('In local mode files up to 1.2 MB are supported');const url=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(f)});const id=uid();localStorage.setItem('pd_file_'+id,url);diskSync();return{id,url:'#file-'+id,sizeBytes:f.size}},delete:async id=>{localStorage.removeItem('pd_file_'+id);diskSync()}};
 FB.downloads={save:async({filename,data})=>{const a=document.createElement('a'),u=URL.createObjectURL(data);a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return{status:'saved'}}};
 document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#file-"]');if(a){e.preventDefault();const d=localStorage.getItem('pd_file_'+a.getAttribute('href').slice(6));if(d)fetch(d).then(r=>r.blob()).then(b=>window.open(URL.createObjectURL(b),'_blank'))}
 });
 const so=$('#signOut');if(so)so.style.display='none';
 started=true;startApp({displayName:'',email:''})}
async function api(path,o={}){
 const h={'x-requested-with':'pd'};let body=o.body;
 if(body!==undefined&&!(body instanceof Blob)&&typeof body!=='string'){h['content-type']='application/json';body=JSON.stringify(body)}
 if(o.raw)h['content-type']='application/octet-stream';
 const r=await fetch('/api'+path,{method:o.method||'GET',headers:h,body,credentials:'same-origin'});
 let j=null;try{j=await r.json()}catch(e){}
 if(r.status===401&&path!=='/auth'&&started&&!FB.demo){location.reload();throw new Error('Signed out')}
 if(!r.ok){const e=new Error((j&&j.error)||('Request failed ('+r.status+')'));e.code=r.status;throw e}
 return j}
function makeRemoteDb(){
 const store={},sigs={},subs=[];let timer=null;
 const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
 const snap=(name,q)=>{let docs=Object.entries(store[name]||{}).map(([id,v])=>({id,data:()=>JSON.parse(JSON.stringify(v))}));
  if(q.ob)docs.sort((a,b)=>{const x=a.data()[q.ob[0]],y=b.data()[q.ob[0]];return(x>y?1:x<y?-1:0)*(q.ob[1]==='desc'?-1:1)});
  if(q.lim)docs=docs.slice(0,q.lim);return{docs}};
 const notify=name=>subs.filter(s=>s.name===name).forEach(s=>s.cb(snap(name,s.q)));
 const fetchCol=async(name,force)=>{const r=await api('/docs?c='+name);const m={};r.docs.forEach(d=>m[d.id]=d.data);
  const changed=force||!same(store[name],m);store[name]=m;if(changed)notify(name)};
 const poll=async()=>{if(document.hidden||!subs.length)return;
  try{const{sig}=await api('/sync');
   for(const name of new Set(subs.map(s=>s.name))){const v=sig[name]||'0:0';if(sigs[name]!==v){sigs[name]=v;await fetchCol(name)}}}catch(e){}};
 const start=()=>{if(!timer){timer=setInterval(poll,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()})}};
 const coll=name=>{const q={},o={orderBy:(f,d)=>{q.ob=[f,d||'asc'];return o},limit:n=>{q.lim=n;return o},
  onSnapshot:(cb,err)=>{const s={name,cb,q};subs.push(s);start();
   (async()=>{try{if(!store[name])await fetchCol(name,true);else cb(snap(name,q));const{sig}=await api('/sync');sigs[name]=sig[name]||'0:0'}catch(e){if(err)err(e)}})();
   return()=>subs.splice(subs.indexOf(s),1)},
  doc:id=>({
   set:async v=>{const prev=(store[name]||{})[id];(store[name]=store[name]||{})[id]=JSON.parse(JSON.stringify(v));notify(name);
    try{await api('/docs?c='+name+'&id='+encodeURIComponent(id),{method:'PUT',body:v})}catch(e){if(prev===undefined)delete store[name][id];else store[name][id]=prev;notify(name);throw e}},
   delete:async()=>{const prev=(store[name]||{})[id];if(store[name])delete store[name][id];notify(name);
    try{await api('/docs?c='+name+'&id='+encodeURIComponent(id),{method:'DELETE'})}catch(e){if(prev!==undefined)store[name][id]=prev;notify(name);throw e}}})};return o};
 return{collection:coll,settings(){}}}
function boot(u){
 $('#login')?.remove();
 if(started)return;started=true;startApp({displayName:u.name||'',email:u.email||''});
 const so=$('#signOut');if(so&&u.role==='admin')so.insertAdjacentHTML('beforebegin','<a class="nav" href="/users" style="margin-top:6px;width:100%;text-decoration:none">Accounts</a>')}
(function init(){
 if(location.protocol==='file:'||window.pdDisk){startDemo();return}
 FB.db=makeRemoteDb();
 FB.assets={upload:async f=>{if(f.size>4*1024*1024)throw new Error('Files up to 4 MB are supported');
   return api('/files?name='+encodeURIComponent(f.name)+'&type='+encodeURIComponent(f.type||'application/octet-stream'),{method:'POST',body:f,raw:true})},
  delete:async id=>{await api('/files?id='+encodeURIComponent(id),{method:'DELETE'})}};
 FB.downloads={save:async({filename,data})=>{const a=document.createElement('a'),u=URL.createObjectURL(data);a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return{status:'saved'}}};
 api('/auth').then(r=>boot(r.user)).catch(e=>showLogin(e.code===401?'':'Cannot reach the server: '+e.message))
})();
